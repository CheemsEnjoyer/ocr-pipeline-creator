services:
  app:
    build: .
    image: ocr-pipeline-creator:local
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-5173}:5173"
    env_file: &app-env-file
      - path: .env
        required: false
    environment: &app-environment
      HOST: 0.0.0.0
      PORT: "5173"
      BACKEND_PORT: "8000"
      BACKEND_URL: http://127.0.0.1:8000
      OCR_DATA_DIR: /app/data
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?Set CELERY_BROKER_URL in .env to your existing Redis}
      OCR_EXTERNAL_WORKER: "1"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  worker:
    image: ocr-pipeline-creator:local
    build: .
    init: true
    restart: unless-stopped
    env_file: *app-env-file
    environment: *app-environment
    command: ["/app/.venv/bin/python", "-m", "celery", "-A", "backend.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 5m

  migrate:
    image: ocr-pipeline-creator:local
    build: .
    env_file: *app-env-file
    environment: *app-environment
    command: ["/app/.venv/bin/python", "-m", "backend.migrate"]

  dispatcher:
    image: ocr-pipeline-creator:local
    build: .
    init: true
    restart: unless-stopped
    env_file: *app-env-file
    environment: *app-environment
    command: ["/app/.venv/bin/python", "-m", "backend.dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
