services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5173}:5173"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "5173"
      BACKEND_PORT: "8000"
      BACKEND_URL: http://127.0.0.1:8000
      OCR_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
